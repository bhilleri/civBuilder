<meta charset="utf-8">
<title>Écran de la ville CivBuilder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block">
<style>
/* Mise en page : écran de jeu en 1920 × 1080 ; en-tête et onglets sur toute la largeur, puis explication à gauche et carte + listes à droite */
:root{
  color-scheme:dark;
  --fond:#0b0e15;--panneau:#131824;--surface:#1a2030;--surface2:#222a3c;--trait:#2a3245;--trait2:#3a4358;
  --texte:#e7e9ef;--doux:#b0b7c6;--muet:#8a92a5;
  --nour:#97c459;--prod:#d9a066;--den:#f2d16b;--eau:#5dc4e8;--rech:#5dcaa5;--cult:#ed93b1;--def:#b4b2a9;--bien:#c9b3ff;
  --bat:#8f86e6;--com:#c9ac7a;
  --ok:#4fc3a1;--av:#f0a03c;--cr:#f08a8a;--sel:#ffffff;--action:#3b6fe0;
  --titre:"Space Grotesk",Inter,system-ui,sans-serif;--corps:Inter,system-ui,sans-serif;
}
html,body{height:100%}
i.ti{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;font-size:1.2em;line-height:1;vertical-align:-.22em;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;overflow:hidden;max-width:1.25em}
body{background:var(--fond);color:var(--texte);font-family:var(--corps);font-size:14px;line-height:1.45;margin:0}
.page{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1920px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--muet);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bascule{display:inline-flex;border:1px solid var(--trait2);border-radius:8px;overflow:hidden}
.bascule button{background:transparent;color:var(--doux);border:0;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.bascule button[aria-pressed="true"]{background:var(--surface2);color:var(--texte)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
/* En-tête global */
.entete{background:var(--panneau);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:center}
.nom{font-family:var(--titre);font-size:26px;font-weight:600;letter-spacing:.2px}
.etatville{color:var(--doux);font-size:14px;display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.alertes{display:flex;flex-direction:column;gap:2px}
.alerte{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.alerte:hover{background:var(--surface)}
.ok{color:var(--ok)}.av{color:var(--av)}.cr{color:var(--cr)}
/* Onglets : gouvernent toute la zone en dessous */
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--trait)}
.onglets button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--doux);font:inherit;font-family:var(--titre);font-size:16px;padding:8px 18px;cursor:pointer;display:flex;gap:8px;align-items:center}
.onglets button[aria-selected="true"]{color:var(--texte);border-bottom-color:var(--texte)}
.zone{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pn{background:var(--panneau);border-radius:10px;padding:12px 14px;min-width:0}
.titrepn{font-family:var(--titre);font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.lb{font-size:12.5px;color:var(--doux)}
.mu{font-size:12px;color:var(--muet)}
/* Cartes de grandeur */
.cartes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.carte{background:var(--surface);border:1px solid transparent;border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.carte[aria-pressed="true"]{border-color:var(--sel)}
.carte .val{font-family:var(--titre);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.carte .tete{display:flex;align-items:center;gap:6px;font-size:13px}
.badge{margin-left:auto;font-size:11px;background:var(--surface2);border-radius:4px;padding:1px 6px;color:var(--texte)}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.pastille{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid transparent;border-radius:14px;padding:4px 11px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
.pastille[aria-pressed="true"]{border-color:var(--sel)}
.pastille b{font-weight:500;font-variant-numeric:tabular-nums}
/* Pile */
.fil{font-size:13px;color:var(--doux);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fil button{background:none;border:0;color:#8fb4f0;font:inherit;cursor:pointer;padding:0}
.fil .ici{color:var(--texte);font-weight:500}
table.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tb th{font-weight:400;color:var(--muet);font-size:12px;text-align:right;padding:5px 6px}
.tb td{border-top:1px solid var(--trait);padding:6px;text-align:right;font-size:13.5px}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb tr.cl{cursor:pointer}.tb tr.cl:hover td{background:var(--surface)}
.tb td.g{color:var(--doux)}
.ligne{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--trait);font-size:13.5px}
.ligne:first-child{border-top:0}
.barre{height:6px;border-radius:3px;background:var(--trait);overflow:hidden;display:flex}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.seg{display:inline-flex;border:1px solid var(--trait2);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;color:var(--doux);border:0;border-left:1px solid var(--trait2);padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--texte);color:var(--fond)}
.btn{background:var(--action);color:#fff;border:0;border-radius:7px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn2{background:var(--surface);color:var(--texte);border:1px solid var(--trait2);border-radius:7px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
/* Carte de la ville */
.cadre{position:relative}
.cadre svg{display:block;width:100%;height:auto;background:#0f131c;border-radius:8px}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:28px;border-radius:6px;border:1px solid var(--trait2);background:var(--surface);color:var(--texte);font-size:16px;cursor:pointer}
.bulle{position:absolute;pointer-events:none;background:#0b0e15;border:1px solid var(--trait2);border-radius:7px;padding:6px 9px;font-size:12.5px;max-width:260px;z-index:3}
.bandeau-carte{background:#2b2512;color:#f3cf72;border-radius:6px;padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
.legcarte{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:8px;padding:8px 10px;background:var(--surface);border-radius:8px;font-size:12.5px;align-items:center}
.legcarte .bloc{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legcarte .titre{color:var(--muet);font-size:11.5px;width:100%}
.legcarte .el{display:inline-flex;align-items:center;gap:6px;color:var(--texte)}
.legcarte button.el{background:transparent;border:1px solid var(--trait2);border-radius:14px;padding:2px 9px;font:inherit;font-size:12.5px;cursor:pointer}
.legcarte button.el[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.sw{width:18px;height:12px;border-radius:3px;display:inline-block;flex:none}
.degrade{width:120px;height:10px;border-radius:5px;display:inline-block}
.liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px}
.item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:transparent;color:inherit;font:inherit;text-align:left}
.item:hover{background:var(--surface)}
.item[aria-pressed="true"]{border-color:var(--sel)}
.ico{width:28px;height:28px;border-radius:6px;background:#29234a;color:#d8d3ff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.ico.amen{background:#1f3320;color:#a6dc8e;border-radius:50%}
.ico.bonus{background:#14302f;color:#7fd8cf;border-radius:4px;transform:rotate(45deg) scale(.82)}.ico.bonus i{transform:rotate(-45deg)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;border-radius:4px;padding:0 6px;vertical-align:1px}
.tag.bat{background:#29234a;color:#d8d3ff}.tag.bonus{background:#14302f;color:#7fd8cf}.tag.amen{background:#1f3320;color:#a6dc8e}
.groupe{font-family:var(--titre);font-size:13px;color:var(--doux);margin:8px 0 2px;display:flex;align-items:center;gap:6px;grid-column:1/-1}
.voile{position:fixed;inset:0;background:rgba(5,7,12,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.fenetre{background:var(--panneau);border:1px solid var(--trait2);border-radius:12px;padding:16px 18px;width:min(1400px,100%);max-height:90vh;display:flex;flex-direction:column}
.fenetre .tb td{vertical-align:middle}
.etapes{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--doux);flex-wrap:wrap}
.etapes b{color:var(--texte);font-weight:500}
.frein{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--surface);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.frein .diag{cursor:pointer;display:flex;gap:6px;align-items:baseline}
.frein .remedes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn2.rem{padding:2px 9px;font-size:12.5px}
.carte.indic{background:transparent;border:1px solid var(--trait);cursor:default}
.lienhist{background:none;border:0;color:inherit;font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline dotted}
@media (max-width:1100px){.zone,.entete{grid-template-columns:minmax(0,1fr)}.cartes{grid-template-columns:repeat(2,minmax(0,1fr))}.deux{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.carte,.pastille,.item{transition:border-color .12s}}
</style>

<div class="page" id="racine" tabindex="-1">
  <div class="note">
    <span>Maquette de l'écran de la ville · chiffres d'exemple, systèmes pas encore dans le jeu (eau, commerce, bâtiments, recherche…)</span>
    <span class="bascule" role="group" aria-label="Ville d'exemple"><button data-ville="petite" aria-pressed="true">Paris · bourg</button><button data-ville="grande" aria-pressed="false">Lugdun · grande ville</button></span>
    <span>Clavier : 1 à 4 grandeurs · B construire · Entrée mettre en file · Échap remonter</span>
  </div>

  <header class="entete" id="entete"></header>

  <nav class="onglets" role="tablist" id="onglets"></nav>

  <div class="zone" id="zone">
    <div class="col" id="gauche"></div>
    <div class="col" id="droite">
      <section class="pn">
        <div class="lb" id="legende" style="margin-bottom:6px"></div>
        <div class="legcarte" id="legendeCarte" aria-label="Légende et couches de la carte"></div>
        <div class="cadre" id="cadre">
          <svg id="carte" viewBox="0 0 520 380" role="img" aria-label="Carte de la ville"></svg>
          <div class="zoom" id="zoomb"><button data-z="1.4" aria-label="Zoomer">+</button><button data-z="0.71" aria-label="Dézoomer">−</button><button data-z="0" aria-label="Recentrer"><i class="ti ti-focus-centered" aria-hidden="true"></i></button></div>
          <div class="bulle" id="bulle" hidden></div>
        </div>
      </section>
      <section class="pn">
        <div class="titrepn" style="margin-bottom:6px"><span id="titreliste"></span><span class="mu" id="infoliste" style="margin-left:auto"></span></div>
        <div class="liste" id="liste"></div>
      </section>
    </div>
  </div>
</div>

<script>
/* ---------- Grandeurs ---------- */
const G={
  nour:{n:"Nourriture",c:"var(--nour)",rgb:"151,196,89",i:"ti-wheat",u:"",de:"la nourriture"},
  prod:{n:"Production",c:"var(--prod)",rgb:"217,160,102",i:"ti-hammer",u:"",de:"la production"},
  den:{n:"Deniers",c:"var(--den)",rgb:"242,209,107",i:"ti-coins",u:"",de:"les deniers"},
  eau:{n:"Eau",c:"var(--eau)",rgb:"93,196,232",i:"ti-droplet",u:" m³/s",de:"l'eau"},
  rech:{n:"Recherche",c:"var(--rech)",rgb:"93,202,165",i:"ti-flask",u:"",de:"la recherche",sec:1},
  cult:{n:"Culture",c:"var(--cult)",rgb:"237,147,177",i:"ti-feather",u:"",de:"la culture",sec:1},
  def:{n:"Défense",c:"var(--def)",rgb:"180,178,169",i:"ti-shield",u:"",de:"la défense",sec:1},
  bien:{n:"Bien-être",c:"var(--bien)",rgb:"201,179,255",i:"ti-mood-smile",u:"",de:"le bien-être",sec:1}
};
G.hab={n:"Habitants",c:"var(--bien)",rgb:"201,179,255",i:"ti-users",u:"",de:"la population"};
const PRINC=["nour","prod","den","eau"],SECS=["rech","cult","def","bien"],TOUTES=PRINC.concat(SECS);
const ST={ok:"ti-circle-check",av:"ti-alert-triangle",cr:"ti-circle-x"};
const etat=(e,t)=>`<span class="${e}"><i class="ti ${ST[e]}" aria-hidden="true"></i>${t?" "+t:""}</span>`;
const f1=x=>x.toFixed(1).replace('.',','),f2=x=>x.toFixed(2).replace('.',',');
const nb=x=>Math.round(x).toLocaleString('fr-FR');
const fv=(r,v)=>r=="eau"?(Math.abs(v)<5?f2(v):f1(v)):(G[r].sec&&r!="rech"&&r!="cult"?String(Math.round(v)):f1(v));
const sg=(r,v)=>(v>=0?"+":"−")+fv(r,Math.abs(v));
const hexpts=(x,y,s)=>[[0,-1],[.866,-.5],[.866,.5],[0,1],[-.866,.5],[-.866,-.5]].map(([a,b])=>`${(x+a*s).toFixed(1)},${(y+b*s).toFixed(1)}`).join(' ');
let rs=7;const rnd=()=>{rs=(rs*16807)%2147483647;return (rs-1)/2147483646};
const dist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;
const DIRS=["est","nord-est","nord","nord-ouest","ouest","sud-ouest","sud","sud-est"];
const direction=(h,c)=>DIRS[((Math.round(Math.atan2(-(h.y-c.y),h.x-c.x)/(Math.PI/4))%8)+8)%8];
function cellules(R,s){const L=[];for(let q=-R;q<=R;q++)for(let r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++)L.push({q,r,x:260+s*1.732*(q+r/2),y:190+s*1.5*r,k:q+","+r});return L}
function nommer(H){const c=H.find(h=>h.k=="0,0");const vus={};H.forEach(h=>{if(h.k=="0,0"){h.nom="Centre-ville";return}const d=dist(h,c),dir=direction(h,c);let n=`${h.type[0].toUpperCase()+h.type.slice(1)} ${dir=="est"||dir=="ouest"?"de l'":"du "}${dir}${d>=3?" lointain":""}`;vus[n]=(vus[n]||0)+1;if(vus[n]>1)n+=" "+["","","bis","ter","quater"][Math.min(4,vus[n])];h.nom=n})}
const ICO={moulin:"ti-wind-mill",atelier:"ti-tools",marche:"ti-building-store",citerne:"ti-droplet-half-2",caserne:"ti-shield",autel:"ti-candle",grenier:"ti-building-warehouse",port:"ti-anchor",temple:"ti-building-church",biblio:"ti-books",banque:"ti-coin",aqueduc:"ti-building-arch",scierie:"ti-trees",charbon:"ti-flame",puits:"ti-bucket",peage:"ti-road-sign",sanct:"ti-sparkles",palis:"ti-fence",ecole:"ti-school",thermes:"ti-bath",theatre:"ti-masks-theater",remparts:"ti-building-castle",champ:"ti-champ",paturage:"ti-paturage",coupe:"ti-coupe",irrig:"ti-irrig",egouts:"ti-egouts",paves:"ti-paves",fontaines:"ti-fontaines",jardins:"ti-jardins",artisans:"ti-artisans",comptoirs:"ti-comptoirs",drainage:"ti-drainage"};
const serie=(n,a,b,bruit,ev={})=>{let v=a,o=[];for(let i=0;i<n;i++){v+=(b-a)/n+Math.sin(i*1.7)*bruit+(ev[i]||0);o.push(v)}const k=b-o[n-1];return o.map((x,i)=>x+k*i/(n-1))};

/* ---------- Bourg ---------- */
function petite(){
  const H=cellules(1,62),T={"0,0":["centre",2,2,1,1,0,0],"0,-1":["forêt",1.4,3.1,0,0,300,500],"1,-1":["forêt",1.4,3.1,0,0,300,500],"-1,0":["forêt",1.4,3.1,0,0,300,500],"1,0":["taïga",0.6,1.3,0,0,100,500],"-1,1":["prairie du fleuve",1.3,0,0.5,0,200,500],"0,1":["taïga",0.1,0.1,0,0,20,500]};
  H.forEach(h=>{const t=T[h.k];h.type=t[0];h.v={nour:t[1],prod:t[2],den:t[3]};h.urb=!!t[4];h.w=t[5];h.cap=t[6];h.bois=/forêt|taïga/.test(h.type);h.riv=h.k=="-1,1"||h.k=="-1,0"});
  const pr=H.find(h=>h.k=="-1,1");pr.am="champ";pr.cap=1500;pr.v.nour=2.6;pr.bonus=["drainage"];
  const B=[
    {t:"moulin",nom:"Moulin à eau",k:"-1,1",emp:[40,40],ent:0.2,b:{nour:{"-1,1":0.2,"-1,0":0.1,"0,1":0.1},den:{"-1,1":0.1}}},
    {t:"atelier",nom:"Atelier de taille",k:"0,0",emp:[30,60],pal:"palier 1 sur 2 · plein : +30 % (manque 30 actifs)",ent:0.2,b:{prod:{"0,-1":0.35,"1,-1":0.35,"-1,0":0.35,"1,0":0.15,"0,1":0.1},den:{"0,0":0.2}}},
    {t:"marche",nom:"Marché",k:"0,0",emp:[20,20],ent:0.1,b:{den:{"0,0":0.5}}},
    {t:"caserne",nom:"Caserne",k:"0,0",emp:[25,25],ent:0.3,b:{def:{"0,0":3}},note:"formation des soldats +25 %"},
    {t:"autel",nom:"Autel des ancêtres",k:"0,0",emp:[5,5],ent:0.1,b:{cult:{"0,0":1},bien:{"0,0":2}}}];
  nommer(H);
  return {nom:"Paris",hab:2439,palier:2,suiv:3000,croit:37,actifs:1220,chom:0,H,B,
    com:{nour:{rec:0.4,env:1.2},prod:{rec:0.6,env:0},den:0.4},solde:1,impot:0,
    base:{rech:[["Habitants instruits (éducation 4 %)",0.5]],cult:[["Centre de la ville",1]],def:[["Défense de base",5]],bien:[["Niveau de départ",50],["Nourriture couverte",10]]},
    moins:{bien:[]},
    eau:{pris:0.85,max:1.02,src:[["Fleuve la Vesse","6 % du débit d'étiage (12 m³/s)",0.61,0.70],["Ruisseau de Deld","à sec en août",0.10,0.10],["Puits (nappes)","720 mm/an",0.14,0.22]]},
    file:[["Milice",15,9,null,null],["Charbonnière · Forêt du nord-ouest",30,0,"0,-1","charbon"]],
    AX:[{v:"Lyon",voie:"gué et route",duree:2,env:["blé"],rec:[],den:0.4,risque:["ok","faible"]},{v:"Arles",voie:"fleuve, barques",duree:3,env:[],rec:["poisson séché","bois"],den:-0.7,risque:["av","pirates du fleuve"]}],
    pos:{Lyon:[470,60],Arles:[450,330]},depend:"aucune",transport:"6 chevaux sur 10 du pays"};
}
/* ---------- Grande ville ---------- */
function grande(){
  rs=11;const H=cellules(3,29),fl=new Set(["-3,2","-2,2","-1,2","0,2","1,1","2,1","3,0"]);
  const quart={"0,0":"quartier du marché","1,-1":"quartier artisanal","1,0":"quartier du port","1,1":"quartier du port","-1,1":"quartier des thermes","1,-2":"quartier militaire","0,1":"quartier des changeurs","-1,0":"quartier du temple","0,-1":"quartier des écoles"};
  H.forEach(h=>{const d=dist(h,{q:0,r:0});h.urb=d<=1||(d==2&&rnd()<.35)||!!quart[h.k];h.fl=fl.has(h.k);h.riv=h.fl;const cult=!h.urb&&rnd()<.55;

/* Habitants d'une case : pour l'instant, chacun vit là où il travaille (Benjamin, 11/11/2026).

  else if(m.mode=="sec"||m.mode=="g")echelle=deg(G[m.r].rgb,"faible","fort")+el2("",`${G[m.r].n.toLowerCase()} par case${m.mode=="sec"?" (quartiers, bâtiments, bonus)":""}`);
  else if(m.mode=="bat")echelle=el2(sw("transparent","#ffffff"),"case du bâtiment")+el2(sw("transparent","#a9a1ff"),"cases qu'il améliore");
  else echelle=["nour","prod","den"].map(k=>el2(sw(`rgba(${G[k].rgb},.5)`),G[k].n.toLowerCase())).join('')+el2("","couleur : grandeur principale de la case");
  const couchesOk=onglet=="rend"&&m.mode!="placement",L=[["prod",`<span class="sw" style="width:14px;height:14px;border-radius:50%;background:#1f3320;border:1.5px solid #a6dc8e"></span>`,"Aménagements"],["bonus",`<span class="sw" style="width:11px;height:11px;transform:rotate(45deg);background:#14302f;border:1.5px solid #7fd8cf"></span>`,"Bonus"],["bat",`<span class="sw" style="width:14px;height:14px;background:#29234a;border:1.5px solid #6f66d0"></span>`,"Bâtiments"],["chant",`<span class="sw" style="width:14px;height:14px;border:1.5px dashed #e8b98a"></span>`,"Chantiers"]];
