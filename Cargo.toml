[package]
name = "civbuilder"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy (2D + 3D), sans l'audio (inutile pour l'instant) ni la police par défaut
# (remplacée par Inter, voir src/fonts.rs)
bevy = { version = "0.19", default-features = false, features = [
    "default_app", "std", "multi_threaded", "bevy_winit", "bevy_clipboard",
    "x11", "custom_cursor", "sysinfo_plugin",
    "2d_bevy_render", "3d_bevy_render", "ui_api", "ui_bevy_render", "bevy_ui_widgets", "scene", "picking",
] }
rand = "0.9"
noise = "0.9"
# Calcul en parallèle (simulation du climat)
rayon = "1"

[features]
default = ["wayland"]
# Support Wayland (Linux uniquement, ignoré sous Windows)
wayland = ["bevy/wayland"]

# Compilation rapide en dev : optimise les dépendances, pas notre code
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Version à distribuer (cargo build --release, voir package.ps1) : optimisation entre les
# bibliothèques (exécutable plus petit et un peu plus rapide, compilation plus longue).
# Les symboles sont gardés : les messages d'erreur restent lisibles dans le terminal.
[profile.release]
lto = "thin"
